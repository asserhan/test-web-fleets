services:
  postgres:
    image: postgres:16
    container_name: fleets-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleets
    volumes:
      - fleets_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleets"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fleets_postgres_data:
